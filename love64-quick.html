.progress{display:flex;justify-content:space-between;gap:10px;font-size:.79rem;color:#915f8a;font-weight:850}
.bar{background:#f2e5ef;border-radius:99px;height:8px;overflow:hidden;margin:10px 0 20px}.bar span{display:block;width:0;height:100%;background:linear-gradient(90deg,#f65a91,#9772dc);transition:width .2s}

.choices{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.choices button{aspect-ratio:1;min-height:43px;min-width:0;background:#f6f0ff;border:2px solid #c6b8e3;border-radius:50%;color:#5f4e7d;font-weight:900;font-size:.9rem;cursor:pointer}.choices button:nth-child(-n+3){background:#eaf3ff;border-color:#91b4ed}.choices button:nth-child(n+5){background:#fff0f6;border-color:#e89dbd}.choices button[aria-pressed=true]{color:#fff!important;background:#9e63db!important;border-color:#75449f!important;outline:2px solid #75449f;outline-offset:2px}
.scale{display:flex;justify-content:space-between;color:#88738d;font-size:.7rem;gap:8px;margin-top:6px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{border:0;display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:linear-gradient(110deg,#f75c91,#9770e0);color:#fff;padding:11px 17px;font-size:.94rem;font-weight:900;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff5fb;color:#ad4a7d;border:1px solid #edccdf}

<body><header><div><a class="brand" href="love64.html">♡ 恋タイプ64</a><a href="love64-types.html">64タイプ図鑑</a></div></header>
<main><span class="tag">18 QUESTIONS / 約2分</span><h1>まずは18問で、恋の傾向をチェック</h1>
<p class="subtitle">通常の36問から、各判定軸につき3問を選んだ簡易版です。結果は<strong>仮タイプ</strong>。本当に詳しく知りたい場合は36問版を使ってね。</p>
<div class="panel" id="intro"><h2>さっそく始めてみよう</h2><p class="notice">当てはまる度合いを7段階で選ぶだけ。正解・不正解はありません。</p><button id="start" type="button" class="btn">無料でお試し診断 →</button></div>
<div class="panel" id="question-area" hidden>
 <div class="progress"><span id="page">1 / 3ページ</span><span id="answered">0 / 18問回答</span></div><div class="bar"><span id="fill"></span></div>
 <div id="questions"></div><p id="answer-error" role="status"></p>
 <div class="actions"><button type="button" class="btn secondary" id="prev">← 前へ</button><button type="button" class="btn" id="next">次の6問へ →</button></div>
</div>
<div class="panel results" id="result" hidden>
 <span class="tag">あなたのお試し結果</span><p class="notice">18問から推定した仮タイプ</p><div class="code" id="result-code"></div>
 <div class="result-image" id="result-art" aria-hidden="true"></div><h2 id="result-name"></h2><p id="result-desc" class="subtitle"></p>
 <h2 style="text-align:left">6軸の判定傾向</h2><div id="result-axes"></div>
 <p class="notice" id="weak-notice"></p>
 <div class="actions" style="justify-content:center"><a class="btn" href="love64.html">36問で詳しく診断する →</a><a class="btn secondary" id="result-detail" href="love64-types.html">仮タイプの解説を見る</a><button class="btn secondary" id="again" type="button">もう一度試す</button></div>
 <p class="notice">※簡易版では回答数が少ないため、36問版とタイプが異なる場合があります。医学・心理学上の診断ではありません。</p>
</div>
</main>
<script src="assets/love64-story.js?v=20261013-polish5"></script>
<script src="assets/love64-art.js?v=20261015-render1"></script>
<script>
(function(){
'use strict';
const source=[
['好きな人ができると、会う予定を自分から作りたくなる。','EI'],['休日は一人より恋人や友人と過ごす方が元気になる。','EI'],['恋愛の悩みは一人で抱えるより、誰かに話す方が整理できる。','EI'],
['相手の言葉は、まず言葉どおりに受け取る方だ。','RV'],['プレゼントは意味より実用性を重視しやすい。','RV'],['恋愛相談では想像より実際に起きた事実から考える。','RV'],
['喧嘩した時は、まず原因と解決策を整理したい。','LH'],['恋愛でも筋が通っているかどうかを大切にする。','LH'],['「察してほしい」より、言葉で説明してほしいと思う。','LH'],
['デートの予定は事前にある程度決めておきたい。','PF'],['関係が曖昧なまま長く続くのは落ち着かない。','PF'],['恋人とのルールや約束は明確な方がいい。','PF'],
['返信が遅くても「嫌われたかも」とは考えにくい。','SA'],['恋人が一人で出かけても、必要以上に気にならない。','SA'],['意見がぶつかっても「別れるかも」とすぐには思わない。','SA'],
['好きなら自分から連絡やデートに誘う方だ。','DW'],['相手の反応が読めなくても、好意を伝えることができる。','DW'],['喧嘩の後は、自分から話し合いを切り出すことが多い。','DW']
];
const groups=[['EI','人と関わりたい','一人で考えたい'],['RV','現実を重視','想像を重視'],['LH','整理して考える','気持ちから考える'],['PF','予定を決めたい','流れを楽しみたい'],['SA','安心して待てる','反応が気になる'],['DW','自分から動く','様子を見て動く']];
let answers={},page=0;
const $=id=>document.getElementById(id);
function top(){requestAnimationFrame(()=>window.scrollTo({top:0,behavior:'instant'}))}
function render(){
 const parent=$('questions');parent.replaceChildren();
 const first=page*6;
 for(let i=first;i<first+6;i++){
  const section=document.createElement('section');section.className='q';
  const head=document.createElement('h3');head.textContent='Q'+(i+1)+'. '+source[i][0];section.append(head);
  const row=document.createElement('div');row.className='choices';row.setAttribute('role','group');row.setAttribute('aria-label','質問'+(i+1)+'への回答');
  for(let value=3;value>=-3;value--){
   const b=document.createElement('button');b.type='button';b.textContent=value>0?String(value):value===0?'ー':String(value);b.setAttribute('aria-label',['強くそう思う','そう思う','ややそう思う','どちらでもない','ややそう思わない','そう思わない','強くそう思わない'][3-value]);b.setAttribute('aria-pressed',String(answers[i]===value));
   b.addEventListener('click',()=>{answers[i]=value;render();$('answer-error').textContent='';});row.append(b);
  }section.append(row);const scale=document.createElement('div');scale.className='scale';
  const l=document.createElement('span');l.textContent='そう思う';const rr=document.createElement('span');rr.textContent='そう思わない';scale.append(l,rr);section.append(scale);parent.append(section);
 }
 $('page').textContent=(page+1)+' / 3ページ';$('answered').textContent=Object.keys(answers).length+' / 18問回答';$('fill').style.width=(Object.keys(answers).length/18*100)+'%';
 $('prev').disabled=page===0;$('next').textContent=page===2?'お試し結果を見る ♡':'次の6問へ →';
}
function finish(){
 const score={EI:0,RV:0,LH:0,PF:0,SA:0,DW:0};
 source.forEach(([label,axis],i)=>{score[axis]+=answers[i]});
 const base=(score.EI>=0?'E':'I')+(score.RV>=0?'S':'N')+(score.LH>=0?'T':'F')+(score.PF>=0?'J':'P');
 const sub=(score.SA>=0?'S':'A')+(score.DW>=0?'D':'W');
 const info=window.Love64Story?.details(base,sub);
 if(!info){$('answer-error').textContent='結果を表示できませんでした。';return}
 $('question-area').hidden=true;$('result').hidden=false;
 $('result-code').textContent=base+'-'+info.greek;
 $('result-name').textContent=info.style.label+' ／ '+info.name;
 $('result-desc').textContent=info.headline;
 $('result-detail').href='love64-'+base+'-'+sub+'.html';
 const image=$('result-art');image.replaceChildren();
 const art=document.createElement('div');art.className='love64-art-holder';image.append(art);
 if(window.Love64Art)window.Love64Art.apply(art,base,sub);
 const root=$('result-axes');root.replaceChildren();
 let uncertain=[];
 groups.forEach(([axis,positive,negative])=>{
  const val=score[axis],strength=Math.round(Math.abs(val)/9*100);
  const line=document.createElement('section');line.className='axis';
  const h=document.createElement('strong');h.textContent=axis+'：'+(val>=0?positive:negative);
  const p=document.createElement('p');p.textContent='この3問では '+(strength<35?'ほぼ中間':strength<67?'やや傾向あり':'傾向が強め')+'（回答差 '+Math.abs(val)+' / 9点）';
  if(Math.abs(val)<3)uncertain.push(axis);line.append(h,p);root.append(line);
 });
 $('weak-notice').textContent=uncertain.length?'判定が微妙な軸：'+uncertain.join('・')+'。36問で詳しく確かめてみよう。':'傾向が比較的はっきり出ています。36問で詳しく見直せます。';
 if(typeof gtag==='function')gtag('event','love64_quick_complete',{base,sub,uncertain_axes:uncertain.length});
 top();
}
$('start').addEventListener('click',()=>{$('intro').hidden=true;$('question-area').hidden=false;render();top();});
$('prev').addEventListener('click',()=>{if(page>0){page--;render();top()}});
$('next').addEventListener('click',()=>{
 for(let i=page*6;i<page*6+6;i++)if(answers[i]===undefined){$('answer-error').textContent='Q'+(i+1)+'が未回答です。';return}
 if(page===2){finish();return}
 page++;render();top();
});
$('again').addEventListener('click',()=>{answers={};page=0;$('result').hidden=true;$('intro').hidden=false;top()});
})();
</script></body></html>
