<body><header><div><a class="brand" href="love64.html">♡ 恋タイプ64</a><a href="love64-types.html">64タイプ図鑑</a></div></header>
<main><span class="tag">64-TYPE COMPATIBILITY MAP</span><h1>64タイプ相性マップ</h1>
<p class="subtitle">自分のタイプを選ぶと、他の63タイプとのコミュニケーションの相性を一覧で比較できます。<strong>恋愛の優劣ランキングではなく、会話のきっかけを探すマップ</strong>です。</p>
<div class="controls">
 <label>自分の恋タイプ<select id="my-type" aria-label="自分の恋タイプ"></select></label>
 <label>見たいグループ<select id="group"><option value="all">すべて</option><option value="NF">NF 外交官</option><option value="NT">NT 分析家</option><option value="SJ">SJ 番人</option><option value="SP">SP 探検家</option></select></label>
 <label>探したいタイプ<input type="search" id="query" placeholder="ENFP、秘めた一途など" aria-label="探したい恋タイプ"></label>
</div>
<div class="tabs" aria-label="関係の特徴を絞り込む">
<button type="button" data-filter="all" aria-pressed="true">すべて</button>
<button type="button" data-filter="same" aria-pressed="false">🌿 ペースが近い</button>
<button type="button" data-filter="complement" aria-pressed="false">✨ 違いがヒントに</button>
<button type="button" data-filter="discuss" aria-pressed="false">💬 話し合いポイント</button>
</div>
<p id="map-count" class="summary" role="status" aria-live="polite"></p>
<div id="map-grid" class="grid"></div>
<p class="disclaimer">※タイプによる特徴の組み合わせを参考にした娯楽的な分類です。交際の成功率・恋人としての価値・将来を予測するものではありません。気になる相手とは実際に話し合うことを大切にしてください。</p>
<p><a href="love64-compat.html">💞 二人の相性を詳しくチェック →</a>　<a href="love64.html">36問の診断を受ける →</a></p>
</main>
<script src="assets/love64-story.js?v=20261013-polish5"></script>
<script>
(function(){
'use strict';
const service=window.Love64Story;if(!service)return;
const types=service.types,subs=['SD','SW','AD','AW'],greek={SD:'α',SW:'β',AD:'γ',AW:'δ'},groups={NF:['ENFP','INFP','ENFJ','INFJ'],NT:['ENTP','INTP','ENTJ','INTJ'],SJ:['ESFJ','ISFJ','ESTJ','ISTJ'],SP:['ESFP','ISFP','ESTP','ISTP']};
const $=id=>document.getElementById(id),select=$('my-type'),group=$('group'),query=$('query'),root=$('map-grid'),counter=$('map-count');
let mode='all';
for(const base of types)for(const sub of subs){const d=service.details(base,sub);const option=document.createElement('option');option.value=base+'-'+sub;option.textContent=base+'-'+d.greek+'　'+d.style.label;select.append(option)}
const qs=new URLSearchParams(location.search),raw=qs.get('me');
select.value=service.byCode(raw)?raw:'ENFP-SD';
function grade(a,b){
 const aStable=a.sub[0]==='S',bStable=b.sub[0]==='S',aLead=a.sub[1]==='D',bLead=b.sub[1]==='D';
 const n=[0,1,2,3].filter(i=>a.base[i]===b.base[i]).length;
 if(a.base===b.base&&a.sub===b.sub)return {tier:'same',label:'🌿 同じペース',reason:'同じタイプ。似ているからこそ、気持ちは言葉でも確かめたい。'};
 if(aStable===bStable&&(aLead===bLead||n>=3))return {tier:'same',label:'🌿 ペースが近い',reason:'安心の求め方や動くタイミングに共通点が見つかりそう。'};
 if(aStable!==bStable&&aLead===bLead)return {tier:'discuss',label:'💬 話し合いポイント',reason:'不安を感じたときの連絡ペースは先に話しておこう。'};
 if(aLead!==bLead&&(aStable===bStable||n>=2))return {tier:'complement',label:'✨ 違いがヒント',reason:'自分から動く人と相手の様子を見る人で、役割を補い合えるかも。'};
 if(n<=1&&aStable!==bStable)return {tier:'discuss',label:'💬 話し合いポイント',reason:'考え方と安心のペースが違う可能性。まず希望を共有してみて。'};
 return {tier:'complement',label:'✨ 違いがヒント',reason:'得意な伝え方が違う二人。大切にしたいことを話してみよう。'};
}
function render(){
 const current=service.byCode(select.value),term=query.value.trim().toLocaleLowerCase('ja-JP'),g=group.value;
 const frag=document.createDocumentFragment();let n=0;
 for(const base of types)for(const sub of subs){
  const d=service.details(base,sub),info=grade(current,d);
  if(g!=='all'&&!groups[g].includes(base))continue;
  if(mode!=='all'&&info.tier!==mode)continue;
  if(term&&![base,d.name,d.style.label,d.greek,sub,base+'-'+sub].join(' ').toLocaleLowerCase('ja-JP').includes(term))continue;
  const card=document.createElement('article');card.className='card';
  const title=document.createElement('h2');title.textContent=base+'-'+d.greek;
  const label=document.createElement('div');label.className='style';label.textContent=d.style.label;
  const badge=document.createElement('span');badge.className='chip '+info.tier;badge.textContent=info.label;
  const reason=document.createElement('p');reason.textContent=info.reason;
  const link=document.createElement('a');link.href='love64-compat.html?me='+encodeURIComponent(current.base+'-'+current.sub)+'&other='+encodeURIComponent(base+'-'+sub);link.textContent='この組み合わせを詳しく →';
  card.append(title,label,badge,reason,link);frag.append(card);n++;
 }
 root.replaceChildren(frag);
 counter.textContent=n?'64タイプ中 '+n+'タイプを表示中':'該当するタイプがありません。検索や絞り込みを変更してみてね。';
 const url=new URL(location.href);url.searchParams.set('me',current.base+'-'+current.sub);history.replaceState({},'',url);
}
for(const button of document.querySelectorAll('[data-filter]'))button.addEventListener('click',()=>{
 mode=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()
});
select.addEventListener('change',render);group.addEventListener('change',render);query.addEventListener('input',render);
render();
})();
</script></body></html>
