<style>
:root{--ink:#35263e;--pink:#e64a87;--violet:#8269d4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff6fb,#f9f5ff 80%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
.header{background:#fff;border-bottom:1px solid #f0e3ee}.header-in{max-width:760px;margin:auto;padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.header a{color:#a74179;text-decoration:none;font-weight:900;font-size:.84rem}.header a:first-child{font-size:1.1rem}
main{max-width:740px;margin:auto;padding:25px 16px 85px}.eyebrow{display:inline-block;border:1px solid #f6cada;background:#fff1f7;border-radius:24px;color:#b54f7a;font-size:.75rem;padding:5px 11px;font-weight:900}

.progress{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#a94b7f;font-size:.8rem;font-weight:900;margin:0 0 15px}.progress-track{height:8px;background:#f7e7f0;border-radius:99px;overflow:hidden;margin:0 0 24px}.progress-fill{height:100%;background:linear-gradient(90deg,#f4588e,#9972e6);width:0;transition:width .2s}
.scene-title{font-size:clamp(1.16rem,3.7vw,1.45rem);margin:0 0 15px}.chat{display:grid;gap:12px;margin-bottom:23px}

.prompt{color:#6e5878;font-size:.88rem;font-weight:800;margin:12px 0}
.options{display:grid;gap:10px}.choice{width:100%;text-align:left;min-height:54px;padding:14px 16px;border:1px solid #efd2e1;border-radius:14px;background:#fff9fc;color:#734369;font-size:.91rem;font-weight:850;line-height:1.6;cursor:pointer}

<header class="header"><div class="header-in"><a href="love64.html">♡ 恋タイプ64</a><a href="love64-types.html">64タイプ図鑑</a></div></header>
<main>
<span class="eyebrow">STORY × LOVE TYPE</span>
<h1>恋愛の「もしも」シミュレーション</h1>
<p class="subtitle">「既読なのに返事がない」「デートの予定が変わった」――そんなリアルな3つの場面。あなたならどう返す？ 選んだ言葉で展開が変わるよ。</p>
<div class="panel">
 <div class="progress"><span id="step-caption">3つの場面で遊べる</span><span id="step-count">0 / 3</span></div>
 <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="step-fill"></div></div>
 <div id="scene" aria-live="polite"></div>
</div>
<p class="notice">※このゲームは架空のやりとりを楽しむコンテンツです。選択に正解・不正解はなく、診断結果や恋人との関係を断定するものではありません。</p>
<footer>© KOROPOP GAMES / 恋タイプ64　<a href="about.html">運営情報</a></footer>
</main>
<script>
(function(){
'use strict';
const stages=[
 {title:'シーン1：既読がついたのに返事がない',incoming:'昨日の夜に送ったLINE。既読はついてるけど、朝になっても返事がない。',ask:'どうする？',choices:[
  {msg:'「忙しかったらあとで大丈夫！」と送る',reaction:'「ごめん！昨日そのまま寝てた。あとでちゃんと返すね」と返信が来た。',insight:'相手の都合を想像できたのは良いところ。ただ、自分が本当に寂しかったなら落ち着いて伝えてもいい。',style:'considerate'},
  {msg:'「昨日のLINE見れた？」と短く聞く',reaction:'「見たよ！帰ってから返信しようと思ってた」と返ってきた。',insight:'確かめるのも一つの方法。言い方を穏やかにすると、責めずに確認できる。',style:'direct'},
  {msg:'連絡せず、いったん自分の予定を楽しむ',reaction:'お昼頃に「返信遅くなってごめん」とメッセージが届いた。',insight:'待てるのは強み。無理して平気なふりを続ける必要はないから、気になるならあとで伝えよう。',style:'space'}]},
 {title:'シーン2：デート当日に予定変更',incoming:'「ごめん、今日ちょっと疲れてて。外でご飯じゃなくて近場でもいい？」',ask:'なんて返す？',choices:[
  {msg:'「了解！近場で食べたいものある？」',reaction:'「ありがとう。ゆっくり話せる場所がいいかも」と返ってきた。',insight:'柔軟に切り替えることで気楽な時間になることも。自分も楽しめる案にしてみよう。',style:'considerate'},
  {msg:'「いいよ！ただ楽しみにしてたから、次は行きたいな」',reaction:'「そうだよね、ごめん。来週あらためて予定立てよ」と話が進んだ。',insight:'相手の都合も自分の本音も伝えられる。期待を言葉にするのは悪いことではない。',style:'direct'},
  {msg:'「無理しないで、今日は休んで。また会おう」',reaction:'「ありがとう。今度落ち着いたら出かけよう」と返ってきた。',insight:'お互いの余裕を守る選択。ただ、会いたかった気持ちも大切にしていい。',style:'space'}]},
 {title:'シーン3：ちょっとした言い合いのあと',incoming:'さっきの会話で少し気まずくなった。相手から「さっきは言いすぎたかも」とLINE。',ask:'ここからどう返す？',choices:[
  {msg:'「こちらもごめんね。落ち着いたら話そう」',reaction:'「うん、あとで話せたらうれしい」と返ってきた。',insight:'相手を思いやる言葉。気持ちを落ち着けてからお互いの考えを確認できるといい。',style:'considerate'},
  {msg:'「ありがとう。私はあの時こう感じたよ」と伝える',reaction:'「そうだったんだ。ちゃんと聞きたい」と返ってきた。',insight:'責めずに自分の気持ちを伝える方法。「私は」を主語にすると話しやすい。',style:'direct'},
  {msg:'「少し考えたいから、夜に話せる？」',reaction:'「わかった。夜に話そう」と予定が決まった。',insight:'落ち着く時間が必要な場合もある。次に話せる時間を決めると相手も安心しやすい。',style:'space'}]}
];
const params=new URLSearchParams(location.search);
const given=params.get('type')||'',type=/^(?:[EI][NS][TF][JP])-(?:SD|SW|AD|AW)$/.test(given)?given:null;
let idx=0,selected=null,history=[],clicks=0;
const $=id=>document.getElementById(id);
const el=(tag,content,className)=>{const n=document.createElement(tag);n.textContent=content;if(className)n.className=className;return n};
const main=$('scene');
function btn(label,cb,className='primary'){const n=el('button',label,className);n.type='button';n.addEventListener('click',cb);return n}
function progress(n){$('step-count').textContent=n+' / 3';$('step-fill').style.width=(n/3*100)+'%'}
function show(){
 progress(idx);const s=stages[idx];main.replaceChildren();
 const title=el('h2',s.title,'scene-title');main.append(title);
 const chat=el('div','', 'chat');chat.append(el('div',s.incoming,'bubble them'));main.append(chat);
 main.append(el('p',s.ask,'prompt'));
 const list=el('div','','options');
 s.choices.forEach((ch,i)=>list.append(btn(ch.msg,()=>choose(i),'choice')));main.append(list);
}
function choose(i){selected=i;clicks++;const stage=stages[idx],ch=stage.choices[i];
 const list=main.querySelector('.options');if(list)list.replaceChildren();
 const bubble=el('div','','chat');bubble.append(el('div',ch.msg,'bubble self'));bubble.append(el('div',ch.reaction,'bubble them'));main.append(bubble);
 const feedback=el('div','','reaction');feedback.append(el('strong','この選択から考えられること'));feedback.append(el('p',ch.insight));main.append(feedback);
 main.append(btn(idx===2?'最後の振り返りを見る →':'次のシーンへ →',()=>{
  history.push({question:stage.title,choice:ch.msg,style:ch.style,insight:ch.insight});
  idx++;if(idx===stages.length)result();else show();
 }));
 if(typeof gtag==='function')gtag('event','love64_scenario_choice',{scene:idx+1,option:i+1});
}
function result(){
 progress(3);$('step-caption').textContent='3シーン完了！';main.replaceChildren();
 const count={considerate:0,direct:0,space:0};history.forEach(h=>count[h.style]++);
 const lead=Object.keys(count).sort((a,b)=>count[b]-count[a])[0];
 const outcomes={
 considerate:['気遣い上手な調整役','相手の事情を大切にできる選び方。自分の気持ちを後回しにしすぎていないかも時々確かめてみよう。'],
 direct:['気持ちを伝える対話派','曖昧なままにせず言葉を選べるタイプ。相手の答えを待つ余裕があるとさらに伝わりやすい。'],
 space:['余白をつくるマイペース派','距離を置く時間を選べるのが特徴。相手が不安にならないよう、次に話せるタイミングも伝えられるといい。']
 };
 const [title,desc]=outcomes[lead];main.append(el('span','YOUR STORY RESULT','result-badge'),el('h2',title,'result-head'),el('p',desc,'result-text'));
 const list=el('div','','result-list');
 history.forEach((item,i)=>{const n=el('div','','result-line');n.append(el('strong',(i+1)+'. '+item.question));n.append(el('span','あなたの選択：'+item.choice));list.append(n)});
 main.append(list);
 const actions=el('div','','actions');actions.append(btn('📲 結果を共有',async()=>{
  const shared=title+'\n'+desc+'\n'+history.map((h,i)=>(i+1)+'. '+h.choice).join('\n')+'\n'+location.href;
  try{if(navigator.share){await navigator.share({title:'恋タイプ64 シミュレーション',text:shared,url:location.href});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(shared);const msg=$('share-feedback');if(msg)msg.textContent='結果をコピーしました。'}catch(e){const msg=$('share-feedback');if(msg)msg.textContent='共有メニューから送信してください。'}
 },'primary'));
 actions.append(btn('もう一度遊ぶ',()=>{history=[];idx=0;$('step-caption').textContent='3つの場面で遊べる';show()},'secondary'));main.append(actions);
 const msg=el('p','','notice');msg.id='share-feedback';main.append(msg);
 if(type){const link=el('a','このタイプの解説を見る →','secondary');link.href='love64-'+type+'.html';main.append(link)}
 if(typeof gtag==='function')gtag('event','love64_scenario_complete',{result:lead});
}
show();
})();
</script>
</body></html>
